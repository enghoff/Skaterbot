seed: 45
device: cuda:0
num_steps_per_env: 24
max_iterations: 3300
empirical_normalization: {}
obs_groups:
  actor:
  - policy
  critic:
  - policy
  - critic
clip_actions: null
check_for_nan: true
save_interval: 100
experiment_name: wheeled_biped_rough
run_name: fresh2_18
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: true
load_run: 2026-11-05_09-59-49_fresh_18
load_checkpoint: model_500.pt
class_name: OnPolicyRunner
actor:
  class_name: MLPModel
  hidden_dims:
  - 256
  - 128
  - 64
  activation: elu
  obs_normalization: true
  distribution_cfg:
    class_name: GaussianDistribution
    init_std: 0.5
    std_type: log
critic:
  class_name: MLPModel
  hidden_dims:
  - 256
  - 128
  - 64
  activation: elu
  obs_normalization: true
  distribution_cfg: null
algorithm:
  class_name: PPO
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.001
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.003
  desired_kl: 0.01
  max_grad_norm: 1.0
  optimizer: adam
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  share_cnn_encoders: false
  rnd_cfg: null
  symmetry_cfg:
    use_data_augmentation: true
    use_mirror_loss: true
    data_augmentation_func: wheeled_biped_task.drive_symmetry:mirrored
    mirror_loss_coeff: 5.0
policy: {}
