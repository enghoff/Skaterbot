# The firmware for the WeAct STM32G474 board, one binary crate per image.
#
#   board     what every image carries: the clocks, and every way back into ST's
#             USB bootloader, which is how the board is reflashed without anyone
#             at it
#   policy    the trained policy, run on the board for the host to check
#   serial_check
#             the serial link to the Banana Pi through the carrier's J5, and
#             the first image flashed over it, by sbc/flash_mcu.py
#
# flash.ps1 builds one and writes it to the board over USB.
[workspace]
resolver = "3"
members = ["board", "policy", "serial_check"]

# Released embassy crates, matched to each other by their 2026-03-10 releases.
# The chip feature is the exact part on the WeAct board: STM32G474, 48 pins,
# 512 KB of flash. Dual-bank is how the board's option bytes arrived (DBANK=1,
# read over DFU on 2026-09-26), and this firmware leaves the option bytes alone.
[workspace.dependencies]
board = { path = "board" }
embassy-stm32 = { version = "0.6.0", features = ["stm32g474ce", "dual-bank", "memory-x", "time-driver-any", "unstable-pac"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
# A tick that divides the timers' 170 MHz exactly. embassy rounds the divider
# down, so the 32 768 Hz tick this had was 32 774 Hz and every timer ran 190 ppm
# fast, which link.py's clock check found against the PC.
embassy-time = { version = "0.5.1", features = ["tick-hz-1_000_000"] }
embassy-usb = "0.6.0"
embassy-futures = "0.1.2"
cortex-m = { version = "0.7.6", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.0"
heapless = { version = "0.9", default-features = false }
embedded-hal-nb = "1.0.0"
libm = "0.2.16"

[profile.release]
debug = 2
opt-level = "s"
lto = true
codegen-units = 1
