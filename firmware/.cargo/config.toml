# The G474 is a Cortex-M4 with a single-precision FPU.
[build]
target = "thumbv7em-none-eabihf"

# Scheduled for the M4 itself rather than any ARMv7E-M. Among other things this
# tells the compiler the M4's multiply-accumulate takes three cycles where a
# multiply and an add, which round the same, take one each: the policy's
# network went from 3.54 ms a run to 3.40 on that alone.
[target.thumbv7em-none-eabihf]
rustflags = ["-C", "target-cpu=cortex-m4"]
