# Lint and format settings for the whole repository, so that `uv run tools/check.py`
# means the same thing on every machine. Before the build123d migration the CAD
# was KCL and the only Python here was the tooling, which was checked by eye; now
# the CAD itself is Python and the check has to be reproducible.
#
# The rule set is ruff's default (pycodestyle errors, pyflakes) plus import
# sorting, which is the one thing worth enforcing mechanically in a project where
# every module pulls dimensions from every other. Nothing here changes what the
# code means -- it is not a style opinion looking for work.

line-length = 88
# Every script here declares >=3.11 in its own metadata block, and without this
# ruff assumes an older Python and files `import tomllib` under third-party.
target-version = "py311"

[lint]
select = ["E4", "E7", "E9", "F", "I"]

[lint.per-file-ignores]
# `l` is the pendulum's length, in the notation the linearised model is written
# in everywhere it appears -- in the docstring, in docs/, and on paper. E741
# would have it renamed to something that no longer matches the derivation.
"simulation/isaacsim/balance.py" = ["E741"]

[lint.isort]
# cad/ is this repository's own package, not a third-party dependency, so its
# imports sort after build123d rather than beside it.
known-first-party = ["cad"]

[format]
docstring-code-format = false
