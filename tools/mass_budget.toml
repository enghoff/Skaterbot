# Mass budget for the whole robot -- the WHEELED robot, which is main.kcl on
# this branch. The walking robot it grew out of is walking_main.kcl, and its
# budget is this same file on the `main` branch: the branch is the variant
# mechanism, because a single budget file describes a single machine.
#
# What changed from the walking budget: the feet became wheel adapters plus a
# pair of bought skate wheels, and the hip carriers came from the wheeled
# wrapper rather than the walking one. Everything else -- limbs, torso,
# actuators, bearings -- is the same part in the same count.
#
# The printed parts are measured from the CAD every time tools/mass.py runs, so
# nothing in this file records their mass. What it records is which files are
# printed parts, how many of each the robot carries, and the masses of the
# bought and estimated items the CAD does not model.
#
# Provenance for every fixed figure is in the note beside it. Follow that style
# if a line changes: say where the new number came from.

# docs/PLAN.md section 4: the ceiling is set by actuator torque, not chosen.
ceiling_g = 2300.0

[material]
name = "PA12-CF"
density = 1060.0
density_unit = "kg/m3"
# 1.06 g/cm3, from docs/PLAN.md section 4 decision 1. Lighter than the PETG it
# replaced, which is where part of the current headroom came from.

# ---- printed structure, measured from the CAD ------------------------------
# Each entry executes on the engine at the density above. Files are measured
# standalone, so a file must export only printed geometry for its figure to
# mean anything: actuators, bearings and journals live in their own modules and
# are counted as bought items below.
#
# Since the robot became mirror-symmetric the four leg files each build both
# hands, so their count is 1 and the measured figure is the pair. The two limb
# files still describe only two distinct prints between them: both leg segments
# are 105 mm, so the right thigh and the left shin are the same part.

[[printed]]
file = "thigh.kcl"
label = "Thighs, the pair"
count = 1

[[printed]]
file = "shin.kcl"
label = "Shins, the pair"
count = 1

# hip_carrier.kcl itself is a function module with no bodies at its top level,
# so it would measure zero. The wrapper that fixes the 51 mm wheeled span is
# what carries the geometry.
[[printed]]
file = "wheeled_hip_carrier.kcl"
label = "Hip carriers, the pair"
count = 1

[[printed]]
file = "wheel_adapter.kcl"
label = "Wheel adapters, the pair"
count = 1

[[printed]]
file = "torso.kcl"
label = "Pelvis, torso shell, cover"
count = 1

# ---- bought and estimated, not modelled at PA12 density ---------------------

[[fixed]]
label = "Actuators"
each_g = 150.0
count = 8
note = "DAMIAO DM-J3507-2EC, vendor manual V1.0 2024-11-19: Ø46 x 37.9 mm, ~150 g."

[[fixed]]
label = "Bearing, journal, carrier"
each_g = 16.3
count = 4
note = """6800-2RS, Ø10 journal and the flanged metal carrier from hardware.kcl. \
Steel, so it cannot be measured from the CAD at PA12 density. docs/BOM.md \
per-joint tally."""

[[fixed]]
label = "Wheels — 80 mm skate, the pair"
each_g = 60.0
count = 2
note = """ESTIMATE, NOT WEIGHED, and the softest figure in the printed half of this table. Catalogue-typical for an 80 x 24 mm 85A inline-skate wheel; the range across brands is roughly 55-65 g. It is the bare wheel: the two 608 bearings come out for the direct drive, so a vendor figure quoted with bearings fitted is about 24 g per wheel too heavy. Replace this with a weighed figure as soon as a wheel is in hand."""

[[fixed]]
label = "Fasteners"
total_g = 66.0
note = """M3 sets across all eight joints and both covers, 60 g, docs/BOM.md estimate. Plus 6 g for the two wheel clamps: an M5 x 20 cap screw, a Ø30 washer and an M5 heat-set insert at each wheel."""

[[fixed]]
label = "Electronics and wiring"
total_g = 100.0
note = "SBC, CAN wiring and looms. docs/BOM.md estimate; nothing is in hand."

[[fixed]]
label = "Power entry — capacitors, fuse, terminal"
total_g = 60.0
note = """Allowance, and the softest figure in the table: the robot is tethered \
and carries no battery, but the capacitor bank that replaces the battery as the \
bus's regeneration sink has not been sized. docs/PLAN.md."""
