# Mass budget for the whole robot -- the WHEELED robot, which is cad/main.py on
# this branch. The walking robot it grew out of is walking_main.kcl on the
# `walking` branch, along with the KCL it is still drawn in, and its budget is
# this same file there: the branch is the variant mechanism, because a single budget file
# describes a single machine.
#
# What changed from the walking budget: the feet became wheel adapters plus a
# pair of bought skate wheels, and then hip roll was deleted outright. That last
# change is the big one on this table. It takes away two actuators, two of the
# four bearing-journal-carrier sets, both hip carriers and a fifth of the
# fasteners, and it takes the keel and the four cheek gussets out of the pelvis
# as well. The limbs are untouched.
#
# The printed parts are measured from the CAD every time tools/mass.py runs, so
# nothing in this file records their mass. What it records is which files are
# printed parts, how many of each the robot carries, and the masses of the
# bought and estimated items the CAD does not model.
#
# It is also the register of what gets printed, so tools/export.py reads it too.
# A `[[printed]]` entry is one FILE, measured whole; the `[[printed.piece]]`
# entries under it are the individual PRINTS inside that file, one STEP each.
# The two views differ on purpose: a file that builds a handed pair weighs the
# pair but prints as two parts, two files can build the same part, and a pair
# that turns out not to be handed at all -- the wheel adapter -- weighs two and
# prints as one piece with `prints = 2`.
#
# Each piece carries `bodies`, the number of separate solids that piece is built
# from. It is not decoration: exporting one piece out of a file that holds
# several depends on `hide` reaching the exporter, and this is what proves it
# did. The counts were read off the KCL -- the lists these parts are assembled
# from -- and then confirmed against the 2026-08-31 STEP export, which agreed on
# all eight. A count that comes out higher means a sibling part is inside the
# file and it must not be printed. It counts the bodies the piece is DRAWN as;
# the file it is exported to holds one solid, always -- tools/export.py unites
# them, because handing a printer the bodies separately is how the first pelvis
# lost its floor.
#
# Each piece also carries `print_up`: which of its own axes points away from the
# bed when it is printed. tools/gate_g.py slices the piece in that orientation
# and fails it if any feature starts in mid-air -- which FDM cannot print without
# support, and which printed the pelvis rim-down would have done to nine of its
# floor features. It is sent with the files so a vendor is told rather than left
# to choose.
#
# Provenance for every fixed figure is in the note beside it. Follow that style
# if a line changes: say where the new number came from.

# docs/PLAN.md section 4: the ceiling is set by actuator torque, not chosen.
ceiling_g = 2300.0

[material]
name = "SLS PA12"
density = 930.0
density_unit = "kg/m3"
# The density tools/mass_baseline.json was measured at, and the density gate C
# compares against -- NOT what the robot is made of. The baseline is a record of
# the geometry the engine built, and a material change moves every part in it by
# the same ratio for no change of shape at all. Comparing at the density the
# record was taken at keeps that gate answering the question it was built to
# answer; the roll-up above it reports at the real density.
baseline_density = 1060.0
# 0.93 g/cm3, EOS PA2200's published part density, from docs/PLAN.md section 4
# decision 1 as amended on 13 September 2026. It was PA12-CF at 1.06 until then.
#
# CONFIRM THIS WITH WHOEVER SINTERS THE PARTS. Part density for laser-sintered
# PA12 runs 0.90 to 0.95 depending on how the bureau packs and refreshes powder,
# and the whole printed structure moves about 5 g across that band. It is the
# softest number on this table that is not an estimate.
#
# The change is worth about 57 g on its own -- every printed part got 12 per cent
# lighter for no change in shape at all -- which is most of what paid for the
# knee's second bearing. It costs strength in the print plane, 48 MPa against
# PA12-CF's 75, and buys it back in every other direction, 48 against 30. That
# trade is the whole reason the journal could stop being a bought dowel.

# ---- printed structure, measured from the CAD ------------------------------
# Each entry is measured locally by integrating the volume of what its module
# builds, at the density above. A module must build only printed geometry for its
# figure to mean anything: actuators, bearings and journals live in their own
# modules and are counted as bought items below.
#
# `file` named a KCL file until the build123d migration and now names the Python
# module that builds the part. `export` is the function in it, called directly --
# so the `hide` lists these entries used to carry are gone. They existed because
# importing a KCL module ran it and left every part it built standing in the
# scene, which the exporter then had to hide one by one.
#
# `measure` is new, and it is there because a Python module builds nothing until
# it is called. The engine weighed a KCL FILE -- whatever solids it happened to
# leave standing -- so the figure included both hands of a mirrored pair without
# anyone saying so. Naming the functions makes that explicit, and it is why the
# shin entry can carry a mass without carrying a print: its two hands are the same
# solids the thigh already prints.
#
# Since the robot became mirror-symmetric the four leg files each build both
# hands, so their count is 1 and the measured figure is the pair.
#
# THERE ARE FOUR DISTINCT LIMB PRINTS NOW, WHERE THERE WERE TWO PRINTED TWICE.
# Both leg segments are still 105 mm, and while both ended in a flat plate the
# right thigh and the left shin were literally the same solid. Straddling the
# knee ends that: a thigh finishes in a clevis reaching past the knee motor to a
# second bearing, and a shin still finishes in a plate on the wheel motor's rear
# cover. Same number of parts on the robot, twice as many things to slice, and
# the SHIN is the one that did not change -- so it keeps the `limb-105` name and
# the golden STEP that tools/gate_b.py holds it against.

[[printed]]
file = "cad/thigh.py"
label = "Thighs, the pair"
measure = ["thighRight", "thighLeft"]
count = 1

# The clevis is the whole of the difference: 9.75 g a thigh against the plate it
# replaces, for a second bearing on the joint that carries the entire leg below
# it. Still seven bodies, because cad/joint.py's statorClevis comes back as one.
[[printed.piece]]
name = "thigh-105-unmirrored"
export = "thighRight"
prints = 1
bodies = 7  # waist plate, two gussets, output disc, knee clevis, two tie ears
print_up = "-X"  # lying on its outboard face, the tie arches' face uppermost
note = "Right thigh -- limbAssembly as built, clevis rooted on +X, reaching -X."

[[printed.piece]]
name = "thigh-105-mirrored"
export = "thighLeft"
prints = 1
bodies = 7  # waist plate, two gussets, output disc, knee clevis, two tie ears
print_up = "+X"  # the mirror: lying on its outboard face, arches up
note = "Left thigh -- the mirror."

[[printed]]
file = "cad/shin.py"
label = "Shins, the pair"
measure = ["shinRight", "shinLeft"]
count = 1

# `limb-105-unmirrored` IS THE SHIN, AND IS THE SOLID IT ALWAYS WAS. It used to
# be printed twice because it served as the right thigh as well; it is printed
# once now. The name is kept because reference/golden/step carries it and that
# directory is a frozen record, not something regenerated to suit a rename.
[[printed.piece]]
name = "limb-105-unmirrored"
export = "shinLeft"
prints = 1
bodies = 7  # waist plate, two gussets, output disc, stator plate, two tie ears
print_up = "-X"  # lying on its outboard face, the tie arches' face uppermost
note = "Left shin -- limbAssembly as built, stator plate on +X."

[[printed.piece]]
name = "limb-105-mirrored"
export = "shinRight"
prints = 1
bodies = 7  # waist plate, two gussets, output disc, stator plate, two tie ears
print_up = "+X"  # the mirror: lying on its outboard face, arches up
note = "Right shin -- the mirror, stator plate on -X."

# There is no hip carrier. It was the orthogonal bracket between the hip roll
# and hip pitch axes, and with hip roll deleted the hip pitch clevis is part of
# the pelvis instead. The walking robot still has one, in KCL, on the `walking`
# branch, which is where that machine now lives.

# THE JOURNAL SLEEVE IS PRINTED, and it is the only piece on this table that is
# not structure. It is the Ø10 tube the far bearing turns on at each straddled
# joint, fitted last and from outside -- cad/hardware.py has why it cannot be
# part of the limb it screws to. Steel is what a joint like this normally gets
# and it is what docs/BOM.md still carries as the upgrade; PA12 is strong enough
# for the duty (25 MPa at the 650 N case against 48) and is beaten on two other
# things, both of which the fit coupon settles: SLS holds about ±0.2 mm where the
# bearing's bore is held to eight microns, so a printed sleeve has to be dressed
# to size before it will enter a 6800 at all; and it sits inside a clamped stack
# that PA12 creeps out of, which costs preload on the anchor that is already the
# weak thing about this joint.
[[printed]]
file = "cad/hardware.py"
label = "Journal sleeves, four"
measure = ["journalSleeve"]
count = 4

[[printed.piece]]
name = "journal-sleeve"
export = "journalSleeve"
prints = 4
bodies = 1  # a plain tube
print_up = "+X"  # standing on one end
note = "Ø10 x Ø5.3 x 7. Print spares: it is the one piece here that gets fitted to a bearing bore. A millimetre longer since 2026-09-30, which is the washer it replaced: it stands that far past the bearing so the screw's head sits where it did."

# THE POWER SWITCH BOARD'S FOUR SPACERS, printed since 2026-09-30 because the
# unthreaded Ø6 x 8 spacer they are is in nobody's stock. cad/electronics.py
# says what was tried. A tube bored for the M3 clearance, printed standing up.
[[printed]]
file = "cad/electronics.py"
label = "Power switch spacers, four"
measure = ["powerSwitchSpacerPrint"]
count = 4

[[printed.piece]]
name = "power-switch-spacer"
export = "powerSwitchSpacerPrint"
prints = 4
bodies = 1  # a plain tube
print_up = "+Z"  # standing on one end
note = "Ø6 x Ø3.4 x 8, between the distribution board and the power switch board on each of the four M3 x 20. Print spares."

[[printed]]
file = "cad/wheel_adapter.py"
label = "Wheel adapters, the pair"
measure = ["wheelAdapterRight", "wheelAdapterLeft"]
count = 1

# ONE PIECE, PRINTED TWICE, though cad/wheel_adapter.py builds both hands. The
# adapter is not a handed part: every feature on it is either a cylinder on the
# wheel axis or one of six spaced 60 degrees apart from +Y, so it has a mirror
# plane through its own axis and the left hand is the right hand turned round.
# That is measured and not asserted -- both hands come out at 13222.79 mm3, and
# the right given a half turn about Z differs from the left by 0.000000 mm3 of
# symmetric difference -- and it is why there is no left-hand STEP to slice.
#
# The left hand stays in the CAD, because the scenes and tools/gate_b.py both
# place a body at each wheel and gate B holds each hand against its own golden
# STEP. What it no longer does is come out as a second file: simulation/robot.py
# turns this one mesh a half turn for the left wheel instead.
[[printed.piece]]
name = "wheel-adapter"
export = "wheelAdapterRight"
prints = 2
bodies = 3  # output disc, spigot, plug
print_up = "+X"  # the disc on the bed, the spigot standing up from it
note = "Slice it once and print two. The second one goes on the left wheel turned round; there is no handed version of this part."

# Measured through cad/torso.py, which is the six-motor pelvis: 125 x 68 x 65,
# where the walking robot's is 118 x 68 x 106. The lid and the cover bosses are
# built by functions in cad/torso_shell.py and called from cad/torso.py, so they
# are inside this file's figure and must not be counted again.
[[printed]]
file = "cad/torso.py"
label = "Pelvis, torso shell, cover"
measure = ["torsoAssembly"]
count = 1

# One module, two prints: torsoAssembly is both of them, and each is exported by
# calling its own function.
[[printed.piece]]
name = "pelvis-shell"
export = "pelvisShell"
prints = 1
bodies = 28  # shell, four cover bosses, two clevises, two battery rails, eight battery wall pads, four board posts, four deck ledges, two hoist lugs, IMU seat
print_up = "+Z"  # upright, on its two hip saddles; rim-down starts nine floor features in mid-air
note = """Shell, cover bosses, both hip pitch clevises, and the ten mounting features the battery brought with it -- two rails under the packs, four posts under the power-entry board and four ledges carrying the electronics deck. The box was 125 x 68 x 65 tethered and is 153.9 x 72 x 89 carrying a battery, and cad/wheeled_parameters.py derives every one of those numbers from what has to fit inside. Twelve bodies until hip roll was deleted: the keel and the four cheek gussets existed only to reach down between the roll actuators and to close the voids their cheeks left. The box then lost 41 mm of height and gained 7 of width, which is a further 32 g off; cad/wheeled_parameters.py says why both numbers are what they are. Two more bodies for a week of September 2026, the pads that carried the INA226 bus monitor on the rear wall; they went when the monitor moved onto the controller carrier. Two back again in September 2026, and these ones are not electronics: a hoist lug on each flank, so the robot can be hung from an overhead rail and caught when it topples during development. Three more on 2026-09-30: the fin between the battery packs and a fence beside each, which hung from the electronics deck for a day and moved here so each pack is pushed into a slot of its own, in sight, before the deck goes on. The fences stand on the shell floor end to end, the fin on the left hip saddle's top and then the floor. All three went on 2026-10-05, with the BMS's two floor guides, when the BMS went between the packs and the three became one block: eight pads off the long walls bear on its side foam instead, lifted over the actuator harness and placed round each pack's XT60, which lies in the strip a fence used to fill."""

[[printed.piece]]
name = "torso-cover"
export = "torsoCover"
prints = 1
bodies = 1  # the lid, one solid
print_up = "-Z"  # the plate on the bed, the lip standing up from it

# THE FIRST PRINTED PART ON THIS ROBOT THAT THE KCL NEVER HAD, so it is the one
# piece with no golden STEP behind it and the one piece tools/gate_b.py does not
# list. Gate E carries its holes instead.
#
# It is its own entry rather than part of cad/torso.py's figure because it is a
# separate print with a separate mass: the pelvis, the cover and the deck are
# three parts off the same machine, not one part in three pieces.
[[printed]]
file = "cad/deck.py"
label = "Electronics deck"
measure = ["electronicsDeck"]
count = 1

[[printed.piece]]
name = "electronics-deck"
export = "electronicsDeck"
prints = 1
bodies = 1  # one plate
print_up = "-Z"  # the plate on the bed, its top face down
note = "Carries the controller carrier and the SBC over the battery, and holds the packs down: since 2026-09-30 through foam under the plate, where until then it was said to bear on a 3 mm gap that nothing filled. For a day it also hung two fences and a fin down beside and between the packs; they stand on the pelvis now, because from here they had to find the gap between two packs blind. Its underside was the top half of the BMS's mount until 2026-10-05, two slotted guides over two in the cavity floor; the board went between the battery packs that day and the guides came off. It printed the SBC's four posts until September 2026; the SBC stands on bought standoffs on the controller carrier now, so the deck carries it only at one remove."

# THE SECOND PIECE WITH NO GOLDEN STEP, and it exists for a plain finding rather
# than a refinement: the rear wall was cut to pass three connectors and nothing
# anywhere held any of them. All three housings are constant-section prisms, so
# no cut in a 2.4 mm wall can capture one -- a wall locates them and only a bond
# retains them, and a bond wants depth. This carries the three openings on 6 mm
# of plate, puts a collar through the wall to make each socket 8.4 mm deep, and
# is screwed on from outside.
#
# It also moves the one cut that cannot be adjusted after printing off the 188 g
# pelvis and onto a 9 g part. That is most of why it is a separate print.
# ---- bought and estimated, not modelled at PA12 density ---------------------

[[fixed]]
label = "Actuators"
each_g = 150.0
count = 6
note = """DAMIAO DM-J3507-2EC, vendor manual V1.0 2024-11-19: Ø46 x 37.9 mm, \
~150 g. Six, not eight: hip pitch, knee and wheel on each leg."""

[[fixed]]
label = "Support bearings"
each_g = 5.0
count = 4
note = """6800-2RS, from cad/hardware.py. THE JOURNAL IS ON THE ROW BELOW, not on this one: it was a Ø10 dowel bonded into the limb's output disc, then a stub printed with that disc, and it is a bought sleeve on its own screw again because neither of the others can be ASSEMBLED -- the fork is one print and the motor with its disc bolted on is 4.7 mm too long to enter it. What is left here is the bearing alone. Steel, so it cannot be measured from the CAD at PA12 density. docs/BOM.md per-joint tally. Four sets: the two hip pitch joints, and the two knees since each thigh was given a clevis reaching past its knee motor to a far bearing. It was two while the knee was a flat plate hung on the actuator's own output bearing. The set was 16.3 g until the 6.4 g turned aluminium bearing carrier was deleted -- it was the only bespoke machined part on the robot and nobody sells one, so the front cheek is bored Ø19.2 and the bearing is bonded into the print instead. The printed pelvis takes 4.7 g of that back: material returned to the cheek by the smaller bore, plus the boss that carries the bearing's shoulder now that the carrier's flange is not there to be one."""

[[fixed]]
label = "Journal screws and nuts"
each_g = 3.6
count = 4
note = """What holds one journal in: an M5 x 12 ISO 7380 button head and an ordinary M5 nut filed to the 2.7 mm of an ISO 4035 thin one, the nut captive in a pocket in the limb's output disc. Estimated 2.5 g of screw and 0.8 of nut, steel, so neither can be weighed off the CAD at PA12 density; the 3.6 still carries the 0.3 g DIN 433 washer that went on 2026-09-30, when the printed sleeve grew a millimetre to take its place, and is left high rather than trimmed to an estimate. THE SLEEVE THEY HOLD IS PRINTED and is on the printed table above; it was 2.7 g of steel here until it was, and docs/BOM.md carries steel as the upgrade the fit coupon may force. WHY THERE IS A JOURNAL TO HOLD AT ALL. It was 4.9 g of dowel, then nothing at all when the disc grew its own printed stub -- and a journal that is part of the moving side before the joint is closed cannot be got into the far bearing, whichever of those two it is: the clevis is a single print whose cheeks stand 45.2 mm apart, and an actuator with its limb's disc bolted on measures 49.9 mm to the journal's tip. This is 22.8 g of steel back on the robot to make the four straddled joints assemble at all. cad/parameters.py carries the arithmetic, and says plainly that the anchor in the disc is weaker than the stub was."""

[[fixed]]
label = "Wheels — 80 mm skate, the pair"
each_g = 60.0
count = 2
note = """ESTIMATE, NOT WEIGHED, and the softest figure in the printed half of this table. Catalogue-typical for an 80 x 24 mm 85A inline-skate wheel; the range across brands is roughly 55-65 g. It is the bare wheel: the two 608 bearings come out for the direct drive, so a vendor figure quoted with bearings fitted is about 24 g per wheel too heavy. Replace this with a weighed figure as soon as a wheel is in hand."""

[[fixed]]
label = "Fasteners"
total_g = 51.0
note = """45 g of M3 sets plus 6 g for the two wheel clamps, which are an M5 x 12 cap screw, a Ø30 washer and an M5 heat-set insert each. The screw was an M5 x 20 until it was drawn: the bore it goes into is blind and reaches 15 mm below the head as dimensioned, so a 20 bottoms out and the clamp never sees preload. docs/BOM.md section 10 has the arithmetic. The M3 figure is docs/BOM.md's 60 g estimate for eight joints, pro-rated to six at ten screws a joint. That estimate is known to be low -- BOM.md section 10 puts the installed schedule nearer 90 g for eight, so about 68 g for six -- and it is left at the pro-rated figure only so that this line keeps meaning the same thing it did before hip roll went."""

[[fixed]]
label = "Electronics and wiring"
total_g = 100.0
note = "SBC, CAN wiring and looms. docs/BOM.md estimate; nothing is in hand."

[[fixed]]
label = "Power entry — capacitor bank"
total_g = 20.0
note = """TWO CANS, WEIGHED OFF A DATA SHEET RATHER THAN ALLOWED FOR, September 2026. This line held 60 g for a reservation of four cans of 16 x 25 while docs/BOM.md has specified two Panasonic EEU-FR1V471B since it first named a part -- 10 x 16 mm, about 4 g each. 20 g is those two, the leads to them and a tie and a bead of adhesive round each. THE CANS STAND ON THE POWER SWITCH BOARD NOW rather than on the bought one, because that board covers it. THE CAPACITANCE ITSELF IS STILL NOT SIZED and that has not changed: it was sized to be the bus's only regeneration sink, because a bench supply cannot take current back; the pack is that sink now, and what is left for the bank is local decoupling and lead inductance. What shrank is the reservation, not the bank. THE FUSE AND ITS HOLDER LEFT THIS LINE in September 2026: both are parts on the power switch board now, and that board has a line of its own. The bus TERMINAL this line used to include is gone -- the bought distribution board's own copper is the strip the six branches land on. docs/BOM.md red line."""

[[fixed]]
label = "Power switch board"
total_g = 33.8
note = """The second board this project designs for itself, September 2026: the bought distribution board's own 50 x 50 footprint in 1.6 mm two-layer FR-4, standing 8 mm over it in the pack's positive lead, carrying the main fuse, a MOSFET switch that is the robot's on/off and its low-battery cutoff, and the bulk bank. electrical/power.py is the circuit, electrical/power_pcb.py the board and electrical/power_sch.py the drawing. 34.4 g is a provisional assembly allowance, including 2 g for the active C1 reset parts added on 2026-09-21 (Q5, C7, R25, R26, less R24; unweighed): about 10 for the bare board in 2 oz copper, 8.8 for the four TO-220 switches, 3 for the mini blade holder and its fuse, 3 for thirty-eight through-hole parts and two JST headers, and 7 for the four 8 mm spacers and the four screws that hold it down -- 6.4 since 2026-09-30, when the spacers became prints and moved to the printed table. IT WAS 22 g AND 54 x 32.5 while the board was surface mount and covered half the bought one; going through-hole so that it can be built by hand is what grew it, and the room came from the capacitor bank's reservation. The bank's own two cans are on that line, not this one. The four long screws REPLACE the distribution board's own rather than adding to them. IT WAS 36 g UNTIL 2026-09-16, when the current measurement came off the design: the 8 g reserved for the PBV-R001-F1-1.0 Kelvin shunt is the whole of the difference, and its sense plug J1 went with it. IT WAS 30 g UNTIL 2026-09-22, and the 4.4 g is two more TO-220s: the Vishay SQP120P06-6m7L the switch was drawn around went obsolete, and the commodity IRF4905 that replaced it is 20 mOhm where that was 6.7, so it takes four devices sharing 6 A each to do what two did. Both are 2.2 g. Nothing here has been weighed."""

[[fixed]]
label = "Battery management system"
each_g = 40.0
count = 1
note = """Daly Li-ion NMC 6S 24V 20A, chosen 2026-09-13. WEIGHED, 40 g, on 2026-10-05, the board in hand: 5 g under the 45 g the VENDOR'S OWN specification table gives beside its 58 x 33 x 8.2 mm outline, which this line carried until then. It was 30 g while no board had been chosen. WIRED CHARGE-ONLY: the discharge path stays direct from the pack to the distribution board, so this board only ever sees the charge current of about 2.2 A. That is what lets it be a small board, and no large one fits -- the torso was swept for free volume and the biggest box left anywhere in it is 38 x 64 x 12 mm. It was chosen because it BALANCES, at 30 mA from 4.18 V per cell, and because it fits: the 30 A boards in its own family are 75 mm long and the cheap generic 6S boards that would fit balance nothing at all. cad/electronics.py draws it at catalogue size, standing on edge in the gap between the two bays. What it does NOT buy is an over-discharge cutoff -- that is the power switch board's, at pack level, since 2026-09-15."""

[[fixed]]
label = "Distribution board"
each_g = 13.0
count = 1
note = """SwiftWing PDB-02-XT60: 50 x 50 x 1.6 mm, 4-layer 2 oz copper, an XT60 socket and six pairs of solder tabs, 3S-6S. CATALOGUE FIGURE from the v1.2 datasheet, which is better than most lines here -- it is a published number for a specific part rather than an allowance. It replaces a PCB this project was going to lay out and have fabricated, and it is why the shell is 141 mm wide rather than 135: at 50 mm square it is 12 wider than the bay the custom board needed. Its stated 26 V maximum is the one figure on it that does not match this application and wants confirming -- there are no active parts on the board, so it should be a statement of scope."""

[[fixed]]
label = "Battery — 6S 1000 mAh, two 3S packs in series"
each_g = 86.0
count = 2
note = """Bonka 11.1 V 1000 mAh 35C 3S soft-case LiPo, 11.1 Wh, wired in series for 6S 1000 mAh: 22.2 Wh for 172 g, 129 Wh/kg. WEIGHED, 86 g each, on 2026-10-05, with their own XT60 and balance leads on: 9 g a pack under the 95 g of ElectronicsComp's listing, which this line carried until then, and which was the only published figure -- neither Indian Hobby Center, which had it in stock on 2026-09-30, nor Bonka gives one. Measured the same day at 77 x 38 x 19 mm at most, against the listing's 75 x 32 x 17; docs/NOTES.md has how that is drawn. IT WAS 2 x 144 g UNTIL 2026-09-30, for "a Gens Ace class 3S 2200 mAh pack, 76 x 33 x 25 mm", and no such pack exists: every 3S 2200 mAh pack on sale in India is 105 to 108 mm long and 175 to 184 g, and would not have fitted the bay by 30 mm. The bay kept its size and the pack came down to it, which is -98 g here and 26.6 Wh less energy. Two 3S rather than one 6S is still a packaging decision: a 6S pack is one 35 mm-thick block, and the bay is laid out for two on edge."""

[[fixed]]
label = "Battery series harness"
total_g = 23.0
note = """WEIGHED, 23 g, on 2026-10-05: the ready-made XT60 2-into-1 series harness from Robu, 14 AWG, that joins the two packs. It was part of the estimate on the line below until it was weighed, and the 23 g came out of that estimate rather than being added to it: the estimate never gave the harness a figure of its own, so what it covers now is simply what is left of the 68 g."""

[[fixed]]
label = "Battery wiring, connectors and mounts"
total_g = 45.0
note = """ESTIMATE, nothing weighed, and a line the budget did not have at all while the robot was tethered. DOWN 23 g ON 2026-10-05, the weighed series harness, which has a line of its own now; nothing that is left was re-estimated. UP 3 g ON 2026-09-30 for the battery's foam: five pieces cut from a 5 mm EVA sheet, about 28 cm3 before they are squeezed, at the 0.1 g/cm3 of dense craft EVA. It is the pack harness plus everything that holds the payload down: the pack leads, the panel-mount momentary button that replaced the loop key on 2026-09-16, two JST-XH balance-lead extensions, the INA226 bus monitor, the Matek 12S Pro BEC and the board standoffs. DOWN FROM 85 g, and the 20 is one line: the logic converter was a generic buck module estimated at 25 g and it is a Matek BEC now, 35 x 24 x 5.5 mm and 5 g to catalogue. Nothing else in this lump has been re-estimated. docs/BOM.md section 1 lists them one by one."""
